[project]
name = "fantacalcio"
version = "0.1.0"
description = "Private, local-first decision-support engine for a fantasy-football auction."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "pandas>=2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
