[project]
name = "fantacalcio"
version = "0.1.0"
description = "Private, local-first decision-support engine for a fantasy-football auction."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "pandas>=2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "scipy>=1.11",
    "duckdb>=1.0",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Engine v2 (ADR-2026-070). Import guardati: il core e i test non-ML girano
# senza questi. Promossi in produzione solo se battono le baseline OOS.
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4",
]
# Solo per il cross-check del duale nel test del prezzo ombra (Stage 6).
# La rotta di produzione e' il Lagrangiano sul DP esistente, senza solver.
solver = [
    "pulp>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
